name: Prune root loaders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate index.html to canonical assets
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'src="config.js?v=4"': 'src="assets/js/core/config.js"',
              'src="supabase_client.js?v=5"': 'src="assets/js/core/supabase_client.js"',
              'src="utils.js?v=5"': 'src="assets/js/core/utils.js"',
              'src="data.js?v=5"': 'src="assets/js/core/data.js"',
              'src="indicacion.js?v=5"': 'src="assets/js/modules/clinical/indicacion.js"',
              'src="laboratorio_core.js?v=5"': 'src="assets/js/modules/laboratorio/laboratorio_core.js"',
              'src="lab_resultados.js?v=5"': 'src="assets/js/modules/laboratorio/lab_resultados.js"',
              'src="lab_pendientes.js?v=5"': 'src="assets/js/modules/laboratorio/lab_pendientes.js"',
              'src="lab_recibidas.js?v=5"': 'src="assets/js/modules/laboratorio/lab_recibidas.js"',
              'src="laboratorio.js?v=5"': 'src="assets/js/modules/laboratorio/laboratorio.js"',
              'src="auth.js?v=5"': 'src="assets/js/core/auth.js"',
              'src="app.js?v=5"': 'src="assets/js/core/app.js"',
              'src="home_lab.js?v=5"': 'src="assets/js/modules/laboratorio/home_lab.js"',
              'src="home_usuario.js?v=5"': 'src="assets/js/modules/usuarios/home_usuario.js"',
              'src="lab_resumen.js?v=5"': 'src="assets/js/modules/laboratorio/lab_resumen.js"',
              'href="epidemiologia.css"': 'href="assets/css/epidemiologia/epidemiologia.css"',
              'src="moderadores_core.js"': 'src="assets/js/modules/admin/moderadores_core.js"',
              'src="epi_datos_generales.js"': 'src="assets/js/modules/epidemiologia/epi_datos_generales.js"',
              'src="epi_casos_positivos.js"': 'src="assets/js/modules/epidemiologia/epi_casos_positivos.js"',
              'src="epidemiologia.js"': 'src="assets/js/modules/epidemiologia/epidemiologia.js"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'refactor: point index to canonical assets'
          git push
