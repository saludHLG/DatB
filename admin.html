<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>DatB — Administración</title></head>
<body>
<script>
(async () => {
    const res = await fetch('assets/pages/admin.html');
    if (!res.ok) throw new Error(`No se pudo cargar admin.html: ${res.status}`);
    let html = await res.text();
    const replacements = {
        'href="style.css"': 'href="assets/css/base/style.css"',
        'href="admin.css"': 'href="assets/css/admin/admin.css"',
        'src="config.js?v=5"': 'src="assets/js/core/config.js?v=5"',
        'src="supabase_client.js?v=5"': 'src="assets/js/core/supabase_client.js?v=5"',
        'src="data.js?v=5"': 'src="assets/js/core/data.js?v=5"',
        'src="utils.js?v=5"': 'src="assets/js/core/utils.js?v=5"',
        'src="admin.js?v=5"': 'src="assets/js/modules/admin/admin.js?v=7"'
    };
    for (const [from, to] of Object.entries(replacements)) html = html.replaceAll(from, to);
    html = html.replace('</body>', '<script src="assets/js/core/auth_bridge.js?v=1"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
})().catch(err => {
    document.body.innerHTML = `<pre style="font-family:monospace;padding:2rem">Error cargando administración: ${String(err.message || err)}</pre>`;
});
</script>
</body>
</html>
