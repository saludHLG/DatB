<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>DatB — Acceso</title></head>
<body>
<script>
(async () => {
    const res = await fetch('assets/pages/index.html?v=4');
    if (!res.ok) throw new Error(`No se pudo cargar index.html: ${res.status}`);
    let html = await res.text();
    const replacements = {
        'href="style.css"': 'href="assets/css/base/style.css?v=4"',
        'href="modules.css"': 'href="assets/css/base/modules.css?v=4"',
        'src="config.js"': 'src="assets/js/core/config.js?v=4"',
        'src="supabase_client.js"': 'src="assets/js/core/supabase_client.js?v=4"',
        'src="data.js"': 'src="assets/js/core/data.js?v=4"',
        'src="utils.js"': 'src="assets/js/core/utils.js?v=4"',
        'src="auth.js"': 'src="assets/js/core/auth.js?v=4"',
        'src="app.js"': 'src="assets/js/core/app.js?v=4"'
    };
    for (const [from, to] of Object.entries(replacements)) html = html.replaceAll(from, to);
    html = html.replace('</body>', '<script src="assets/js/core/auth_bridge.js?v=5"><\\/script></body>');
    document.open();
    document.write(html);
    document.close();
})().catch(err => {
    document.body.innerHTML = `<pre style="font-family:monospace;padding:2rem">Error cargando acceso: ${String(err.message || err)}</pre>`;
});
</script>
</body>
</html>
