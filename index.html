<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DatB — Acceso</title>
    <script>
    (async function () {
        try {
            const res = await fetch('assets/pages/index.html?v=7', { cache: 'no-store' });
            if (!res.ok) throw new Error('No se pudo cargar index.html: ' + res.status);
            let html = await res.text();
            const replacements = {
                'href="style.css"': 'href="assets/css/base/style.css?v=7"',
                'href="modules.css"': 'href="assets/css/base/modules.css?v=7"',
                'src="config.js"': 'src="assets/js/core/config.js?v=7"',
                'src="supabase_client.js"': 'src="assets/js/core/supabase_client.js?v=7"',
                'src="data.js"': 'src="assets/js/core/data.js?v=7"',
                'src="utils.js"': 'src="assets/js/core/utils.js?v=7"',
                'src="auth.js"': 'src="assets/js/core/auth.js?v=7"',
                'src="app.js"': 'src="assets/js/core/app.js?v=7"'
            };
            for (const from in replacements) {
                html = html.split(from).join(replacements[from]);
            }
            const bridge = '<script src="assets/js/core/auth_bridge.js?v=7"></' + 'script>';
            html = html.replace('</body>', bridge + '</body>');
            document.open();
            document.write(html);
            document.close();
        } catch (err) {
            document.body.innerHTML = '<pre style="font-family:monospace;padding:2rem">Error cargando acceso: ' +
                String(err && err.message ? err.message : err) + '</pre>';
        }
    })();
    </script>
</head>
<body>
    <noscript>DatB requiere JavaScript para funcionar.</noscript>
</body>
</html>
